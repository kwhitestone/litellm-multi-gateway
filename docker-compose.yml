# litellm-multi-gateway
# 以 LiteLLM 为底层的 Claude Code 网关。核心 = litellm + postgres；
# vision 作为 litellm 的 CustomLogger hook（litellm/hooks/vision_hook.py）运行在进程内，
# 按模型 needs_vision 标记决定转图/透传。不再需要独立 vision 容器。
#
# 启动：        docker compose up -d
# 停止：        docker compose down
#
# 客户端统一指向（BASE_URL）：
#   Anthropic(Claude Code) http://127.0.0.1:4001
#   OpenAI(Hermes 等)      http://127.0.0.1:4001/v1
#
# Admin UI： http://127.0.0.1:4001/ui   （登录见 .env 的 UI_USERNAME/UI_PASSWORD 或用 master key）

services:
  db:
    image: postgres:16-alpine
    # 不对外暴露端口，仅 compose 内网供 litellm 访问（需要调试可加 ports）
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  litellm:
    # build：复用子模块 Dockerfile（LiteLLM + /manage 管理页 + vision hook 一体镜像）。
    # context 为子模块根目录（Dockerfile 内 COPY 路径以此为基准）。
    # 端口：容器内 PORT=4001（Dockerfile ENV 默认值），server.py 读它起 uvicorn。
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env   # 整体载入 .env：所有 *_KEY（ARK/Z_AI/CLAUDE_CODE/…）+ VISION_* 自动透传
    environment:
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
      STORE_MODEL_IN_DB: "True"
      # 不传 --config/--port/--num_workers：入口是 server.py（import litellm app + 挂 /manage 路由）。
      # PYTHONPATH 镜像 ENV 已设好（/app/hooks:/app）；config.yaml 由 volumes 挂载 multi.yaml 覆盖；
      # provider key + VISION_* 由 env_file 注入；vision_hook 读 env 决定视觉模型（默认智谱 glm-5v-turbo）
    volumes:
      - ./litellm/profiles/multi.yaml:/app/config.yaml:ro   # 多后端共存（走 litellm 原生 /v1/messages 等）
      - ./litellm/hooks:/app/hooks:ro   # vision_hook 等 CustomLogger（config callbacks 加载）
    ports:
      - "0.0.0.0:4001:4001"   # 客户端入口 + Admin UI + /manage
    restart: unless-stopped

volumes:
  pg-data:
